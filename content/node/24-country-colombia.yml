  field_our_role:
    -
      value: '<p>Colombia hosts the largest number of Venezuelan migrants in the region, and documentation decides what a family can access. We provide legal aid and documentation support so migrant families can enrol children in school, register for health care and work legally. We also support host communities absorbing the arrivals, because services stretched past their limit fail residents and newcomers together. Our clinics travel the corridor, holding sessions in the towns where families stop for a few days.</p>'
