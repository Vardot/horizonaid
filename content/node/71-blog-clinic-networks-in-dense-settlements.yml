      value: |-
        <h3>Introduction</h3>
        <p><strong>NAIROBI</strong> — Neighbourhood clinics and a twice-weekly mobile unit now serve informal settlements. What began as a local difficulty is now a structural one, and it shapes daily life for every household here. This report sets out what was measured, what it cost, and what changed.</p>
        <h3>The problem, before the work started</h3>
        <p>In dense settlements the barrier is not distance but hours; a clinic thirty minutes away is closed by the time you arrive. Households absorbed the difference themselves — in time, in money, and in risks they would not otherwise take. Those costs rarely appear in a budget line, but they decide whether a family recovers or slips further.</p>
        <blockquote><p>People do not skip care because it is far. They skip it because they cannot lose the working day.</p><p><strong>Dr Peter Kimani</strong>, clinical lead</p></blockquote>
        <h3>How the work was delivered</h3>
        <p>A network of small clinics with staggered hours covers the day between them. The approach was chosen because it survives the conditions here: staff turnover, seasonal access, and a population that may move at short notice.</p>
        <ul><li>Opening hours staggered across the network, including evenings</li><li>Shared referral so a full clinic sends rather than turns away</li><li>Stock pooled and moved between sites weekly</li><li>One patient record used across the network</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="184fa3db-624a-4ccd-9202-012ecfc5be5a" data-align="center" alt="Clinic networks in dense settlements"></drupal-media>
        <h3>What changed beyond the immediate goal</h3>
        <p>The direct objective was met, but the effects that matter most were the ones we did not set out to produce.</p>
        <h4>1. Evening attendance</h4>
        <p>A large share of visits arrived after five, from people who could not come earlier.</p>
        <h4>2. Fewer wasted trips</h4>
        <p>Shared referral meant a full clinic redirected instead of sending people home.</p>
        <h4>3. Stock where it is needed</h4>
        <p>Pooling reduced both stockouts and expiry across the network.</p>
        <h3>What comes next</h3>
        <p>The next phase adds two evening-only sites and puts the shared record on the district system. The measure of success is not how long we stay, but whether the work continues once we have gone.</p>
