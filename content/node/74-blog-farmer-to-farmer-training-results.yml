      value: |-
        <h2>Introduction</h2>
        <p><strong>GEDAREF</strong> — Average harvest per household rose across every participating village this season. Most of the gain came from techniques that farmers learned on a neighbour's plot. This report covers yields, adoption rates and the cost per household trained.</p>
        <h2>The problem, before the work started</h2>
        <p>Techniques taught by an outsider are tried once; techniques shown by a neighbour are adopted. Earlier training was delivered in classrooms by visiting experts, and few farmers changed what they did in the field.</p>
        <blockquote><p>They watched me do it on my own land, with my own risk. That is why they copied it.</p><p><strong>Ibrahim Musa</strong>, lead farmer</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Training runs farmer to farmer, on a working plot, in the season it applies to. Lead farmers are chosen by their villages and paid in seed, so the training stays local and continues between our visits.</p>
        <ul><li>Lead farmers selected by their own cooperative</li><li>Training on a real plot, in the relevant season</li><li>A small stipend for the lead farmer's time</li><li>Follow-up visits scheduled rather than promised</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="e1408d47-fc69-4b5e-a7bb-38ea345953f5" data-align="center" alt="Farmer-to-farmer training results"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Harvests rose in every village, and the method spread faster than we had planned for.</p>
        <h3>1. Adoption that holds</h3>
        <p>Techniques were still in use a full season later, which extension days rarely achieve.</p>
        <h3>2. Faster spread</h3>
        <p>Each lead farmer reached neighbours we never met.</p>
        <h3>3. Advice that fits</h3>
        <p>Because it is local, the advice already accounts for the soil and the rainfall.</p>
        <h2>What comes next</h2>
        <p>The next season doubles the lead-farmer network and adds seed selection to the curriculum. We will know this has worked when villages choose and pay their own lead farmers.</p>
