  field_our_role:
    -
      value: '<p>Afghanistan faces intersecting crises: decades of conflict, severe drought, economic collapse and one of the world''s largest displacement crises. We work in partnership with local organisations across Kabul, Kandahar and the northeastern provinces, delivering emergency shelter, clean water, education support and legal protection to families who have been displaced more than once. Because access shifts week to week, our teams plan in short cycles and pre-position supplies wherever roads stay open. Our approach is community led: we follow the priorities of the people we serve rather than the agendas of external donors.</p>'
      format: content_format
