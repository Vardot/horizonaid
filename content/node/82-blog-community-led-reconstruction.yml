      value: |-
        <h2>Introduction</h2>
        <p><strong>SANA'A</strong> — Households chose and supervised their own repairs in a pilot across two districts. Each household chose its design, held the budget and hired local builders. This report compares the cost and quality of that work with contractor-led repairs.</p>
        <h2>The problem, before the work started</h2>
        <p>Rebuilt without the community, a settlement is repaired once and never maintained. Contractor-led rebuilding produced houses that did not suit how families lived, and nobody felt responsible for maintaining them.</p>
        <blockquote><p>It is their house. We check the structure. They decide everything else.</p><p><strong>Ahmed Saleh</strong>, shelter engineer</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Households choose the design, hold the budget, and hire the labour. Households receive the budget in stages, released when an engineer signs off each stage of work.</p>
        <ul><li>Design chosen by the household from technically approved options</li><li>Budget released in stages against completed work</li><li>Local labour hired directly by the household</li><li>Technical supervision offered, not imposed</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="f749352f-75eb-422e-abca-0696f87555ba" data-align="center" alt="Community-led reconstruction"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Repairs were completed within budget, and community control produced three further results.</p>
        <h3>1. Repairs that continue</h3>
        <p>Households that managed the build carried on maintaining it afterwards.</p>
        <h3>2. Money staying local</h3>
        <p>Direct hiring kept the labour budget inside the community.</p>
        <h3>3. Fewer disputes</h3>
        <p>Owner-led decisions removed most of the conflict that contractor-led rebuilding creates.</p>
        <h2>What comes next</h2>
        <p>The next phase moves technical supervision to a local engineering firm under community contract. This works if the communities hire and supervise the engineering firm themselves.</p>
