        <h3>Introduction</h3>
        <p><strong>SANA'A</strong> — Households chose and supervised their own repairs in a pilot across two districts. What began as a local difficulty is now a structural one, and it shapes daily life for every household here. This report sets out what was measured, what it cost, and what changed.</p>
        <h3>The problem, before the work started</h3>
        <p>Rebuilt without the community, a settlement is repaired once and never maintained. Households absorbed the difference themselves — in time, in money, and in risks they would not otherwise take. Those costs rarely appear in a budget line, but they decide whether a family recovers or slips further.</p>
        <blockquote><p>It is their house. We check the structure. They decide everything else.</p><p><strong>Ahmed Saleh</strong>, shelter engineer</p></blockquote>
        <h3>How the work was delivered</h3>
        <p>Households choose the design, hold the budget, and hire the labour. The approach was chosen because it survives the conditions here: staff turnover, seasonal access, and a population that may move at short notice.</p>
        <ul><li>Design chosen by the household from technically approved options</li><li>Budget released in stages against completed work</li><li>Local labour hired directly by the household</li><li>Technical supervision offered, not imposed</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="ee0c4672-3672-423e-87f3-10aa42804ca7" data-align="center" alt="Community-led reconstruction"></drupal-media>
        <h3>What changed beyond the immediate goal</h3>
        <p>The direct objective was met, but the effects that matter most were the ones we did not set out to produce.</p>
        <h4>1. Repairs that continue</h4>
        <p>Households that managed the build carried on maintaining it afterwards.</p>
        <h4>2. Money staying local</h4>
        <p>Direct hiring kept the labour budget inside the community.</p>
        <h4>3. Fewer disputes</h4>
        <p>Owner-led decisions removed most of the conflict that contractor-led rebuilding creates.</p>
        <h3>What comes next</h3>
        <p>The next phase moves technical supervision to a local engineering firm under community contract. The measure of success is not how long we stay, but whether the work continues once we have gone.</p>
