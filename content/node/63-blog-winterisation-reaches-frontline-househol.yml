        <h3>Introduction</h3>
        <p><strong>KABUL</strong> — Generators, insulation kits and fuel were pre-positioned before the first freeze in eleven frontline settlements. What began as a local difficulty is now a structural one, and it shapes daily life for every household here. This update reports what the teams found, what it cost, and what changed.</p>
        <h3>The problem, before the work started</h3>
        <p>Winter arrives on a fixed date; procurement rarely does. Households absorbed the difference themselves — in time, in money, and in risks they would not otherwise take. Those costs rarely appear in a budget line, but they decide whether a family recovers or slips further.</p>
        <blockquote><p>Buying in December means paying twice and arriving late. We buy in July.</p><p><strong>Zahra Ahmadi</strong>, programme manager</p></blockquote>
        <h3>How the work was delivered</h3>
        <p>Stock bought in summer, distributed on a household list agreed in autumn. The approach was chosen because it survives the conditions here: staff turnover, seasonal access, and a population that may move at short notice.</p>
        <ul><li>Purchasing completed before prices rise in the cold months</li><li>Lists built with community committees, then verified</li><li>Fuel and blankets distributed together, not in separate rounds</li><li>Frontline households prioritised by an agreed vulnerability score</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="6e55f5d3-20dc-4f24-ad34-04266b987d0e" data-align="center" alt="Winterisation reaches frontline households"></drupal-media>
        <h3>What changed beyond the immediate goal</h3>
        <p>The direct objective was met, but the effects that matter most were the ones we did not set out to produce.</p>
        <h4>1. Fewer cold-related admissions</h4>
        <p>Clinics reported a lower winter caseload than the previous two years.</p>
        <h4>2. Predictable cost</h4>
        <p>Summer purchasing removed most of the seasonal price rise from the budget.</p>
        <h4>3. Lists that carry over</h4>
        <p>The verified household list became the starting point for the next season, saving weeks.</p>
        <h3>What comes next</h3>
        <p>The next cycle brings purchasing forward again and adds insulation materials to the standard kit. The measure of success is not how long we stay, but whether the work continues once we have gone.</p>
