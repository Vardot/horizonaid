      value: |-
        <h2>Introduction</h2>
        <p><strong>KABUL</strong> — Generators, insulation kits and fuel were pre-positioned before the first freeze in eleven frontline settlements. In previous winters supplies arrived after the cold had already sent people to hospital. This update reports what was delivered, when, and what it cost compared with last year.</p>
        <h2>The problem, before the work started</h2>
        <p>Winter arrives on a fixed date; procurement rarely does. Families burned plastic and furniture for heat once the fuel ran out. Respiratory admissions rose every January.</p>
        <blockquote><p>Buying in December means paying twice and arriving late. We buy in July.</p><p><strong>Zahra Ahmadi</strong>, programme manager</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Stock bought in summer, distributed on a household list agreed in autumn. Buying in summer avoids the winter price spike, and a list agreed with community leaders in autumn means distribution starts the day the stock arrives.</p>
        <ul><li>Purchasing completed before prices rise in the cold months</li><li>Lists built with community committees, then verified</li><li>Fuel and blankets distributed together, not in separate rounds</li><li>Frontline households prioritised by an agreed vulnerability score</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="6e55f5d3-20dc-4f24-ad34-04266b987d0e" data-align="center" alt="Winterisation reaches frontline households"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Every settlement was supplied before the first freeze, and the early timing produced three further gains.</p>
        <h3>1. Fewer cold-related admissions</h3>
        <p>Clinics reported a lower winter caseload than the previous two years.</p>
        <h3>2. Predictable cost</h3>
        <p>Summer purchasing removed most of the seasonal price rise from the budget.</p>
        <h3>3. Lists that carry over</h3>
        <p>The verified household list became the starting point for the next season, saving weeks.</p>
        <h2>What comes next</h2>
        <p>The next cycle brings purchasing forward again and adds insulation materials to the standard kit. The test is whether local councils run next year's list with the same timing.</p>
