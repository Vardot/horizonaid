  field_content:
    -
      value: "<p>Households that joined the programme two seasons ago now grow enough to feed themselves and sell a surplus at the district market.</p><h3>How it works</h3><p>Each cooperative receives drought-tolerant seed, access to a shared irrigation pump and a season of farmer-to-farmer training. Repayment is made in seed, which stocks the next cooperative's bank.</p><h3>Measured results</h3><p>Average harvest per household rose across all participating villages, and food-aid dependence fell over the same period.</p>"
