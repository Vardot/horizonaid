      value: |-
        <h2>Introduction</h2>
        <p><strong>GOMA</strong> — What our protection teams handle when courts and police are no longer functioning. With courts and police absent, families bring disputes and abuse cases to whoever is still present. This brief sets out what our teams handled, how, and where the gaps remain.</p>
        <h2>The problem, before the work started</h2>
        <p>Protection work in an active conflict cannot wait for the conflict to end. Survivors of violence had nowhere to report, and cases went unrecorded while evidence was lost.</p>
        <blockquote><p>The case does not pause because the road does. Neither can we.</p><p><strong>Josephine Mwamba</strong>, protection officer</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Caseworkers stay reachable, and referrals are built to work when movement is restricted. Caseworkers use phones and mobile visits, and every referral has a second route in case the first is cut off.</p>
        <ul><li>Caseworkers recruited from the communities they serve</li><li>Referral partners confirmed weekly, because availability changes</li><li>Case files encrypted and mirrored outside the area</li><li>Support continued remotely when access closes</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="368bad61-0dbd-4fd3-ac9d-b295fcdd7353" data-align="center" alt="Protection cases in active conflict"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Cases were managed throughout the year, and the work built something the conflict has not destroyed.</p>
        <h3>1. Continuity through closures</h3>
        <p>Cases stayed open during access interruptions instead of restarting afterwards.</p>
        <h3>2. Local trust</h3>
        <p>Caseworkers from the community reached people who would not approach an outside agency.</p>
        <h3>3. Records that survive</h3>
        <p>Mirrored files meant a destroyed office did not mean destroyed cases.</p>
        <h2>What comes next</h2>
        <p>The next phase adds two caseworkers per site and formalises the remote-support protocol. Success is local caseworkers running the service after our teams leave.</p>
