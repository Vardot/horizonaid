      value: |-
        <h3>Introduction</h3>
        <p><strong>KASSALA</strong> — Cooperatives using climate-resilient tools secured steady yields for a second consecutive season. What began as a local difficulty is now a structural one, and it shapes daily life for every household here. This report sets out what was measured, what it cost, and what changed.</p>
        <h3>The problem, before the work started</h3>
        <p>Food aid sustains a household; a harvest ends the need for it. Households absorbed the difference themselves — in time, in money, and in risks they would not otherwise take. Those costs rarely appear in a budget line, but they decide whether a family recovers or slips further.</p>
        <blockquote><p>Seed without water is a wasted season. Water without training is a broken pump. It has to arrive together.</p><p><strong>Amna Hassan</strong>, agriculture officer</p></blockquote>
        <h3>How the work was delivered</h3>
        <p>Inputs, irrigation and training are delivered together, because any one alone fails. The approach was chosen because it survives the conditions here: staff turnover, seasonal access, and a population that may move at short notice.</p>
        <ul><li>Seed, tools and irrigation delivered as one package</li><li>Training tied to the season the technique belongs to</li><li>Cooperative registered before the first distribution</li><li>Exit measured by harvest, not by months elapsed</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="2703edeb-c3da-4295-a7f9-956add15af88" data-align="center" alt="Cultivating independence in rural farms"></drupal-media>
        <h3>What changed beyond the immediate goal</h3>
        <p>The direct objective was met, but the effects that matter most were the ones we did not set out to produce.</p>
        <h4>1. Households off assistance</h4>
        <p>Most participating households were meeting their own food needs within two seasons.</p>
        <h4>2. Surplus reaching market</h4>
        <p>The second harvest produced enough surplus for cooperatives to begin selling.</p>
        <h4>3. Cooperatives that outlast us</h4>
        <p>Registered cooperatives kept operating after the programme closed.</p>
        <h3>What comes next</h3>
        <p>The next phase moves input supply to the cooperatives themselves and keeps only technical support. The measure of success is not how long we stay, but whether the work continues once we have gone.</p>
