        <h2>Introduction</h2>
        <p><strong>GEDAREF</strong> — How repayment in seed rather than cash keeps a cooperative viable after external funding ends. Seed repaid after harvest refills the bank for the next community, so the stock grows instead of running down. This report follows four cooperatives through two repayment cycles.</p>
        <h2>The problem, before the work started</h2>
        <p>Seed distributed as aid disappears in one season; seed lent against a harvest does not. Each season began with farmers waiting for a distribution that could arrive late or not at all. Planting windows were missed while the trucks were still on the road.</p>
        <blockquote><p>The bank does not belong to us. We lend it, we get it back, and next year it belongs to the village down the road.</p><p><strong>Yusuf Adam</strong>, cooperative chair</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Cooperatives borrow from a seed bank and repay in kind after harvest, stocking the next community's bank. Repayment in kind keeps the scheme independent of cash prices and of our funding cycle.</p>
        <ul><li>Varieties chosen with farmers, matched to the local rainfall pattern</li><li>Repayment set in seed, not cash, so a bad market does not break the loan</li><li>Storage built to a design a cooperative can repair with local materials</li><li>Committee bookkeeping taught alongside the agronomy</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="eb19191f-3c64-4787-8f4e-c65ae6df3d8e" data-align="center" alt="Seed banks that outlast the programme"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Repayment rates stayed above ninety per cent, and the bank's effects reached beyond the cooperatives that borrowed from it.</p>
        <h3>1. Independence from procurement</h3>
        <p>Cooperatives running a full cycle no longer need a purchase order to plant, which removes the single longest delay in the season.</p>
        <h3>2. Varieties that keep improving</h3>
        <p>Farmers return the seed that performed, so each cycle concentrates what actually works on that soil.</p>
        <h3>3. A model that travels</h3>
        <p>Three neighbouring villages built their own banks after visiting, with no funding from us at all.</p>
        <h2>What comes next</h2>
        <p>The coming phase hands the audit to a federation of cooperatives and reduces our role to the initial stock. This works if the federation still lends seed five years after our last contribution.</p>
