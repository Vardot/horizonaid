      value: |-
        <h2>Introduction</h2>
        <p><strong>REGIONAL</strong> — The countries and indicators being added to the next edition of the human rights index. The next edition widens to new countries and adds indicators partners asked for. This brief sets out what will be measured and why.</p>
        <h2>The problem, before the work started</h2>
        <p>An index measures what it chose to measure, and the choice is the argument. Partners had raised issues the index did not measure, from detention conditions to access to justice. Leaving them out made those problems harder to raise with governments.</p>
        <blockquote><p>Deciding what to count after you have seen the data is how an index becomes advocacy.</p><p><strong>Dr Leila Mansour</strong>, research lead</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>The next edition's scope is set in public before the data is collected. Partners can comment on the draft scope during the consultation, before fieldwork begins.</p>
        <ul><li>Proposed indicators published for comment before collection</li><li>Selection criteria stated, including what was rejected and why</li><li>Partner organisations invited to propose districts</li><li>Scope fixed before fieldwork, then not changed</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="f749352f-75eb-422e-abca-0696f87555ba" data-align="center" alt="Where the next index will look"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Setting the scope in public is meant to strengthen the data, and early feedback points to three further benefits.</p>
        <h3>1. Fewer disputes later</h3>
        <p>Agreeing scope in advance removed most of the objections the first edition attracted.</p>
        <h3>2. Better coverage</h3>
        <p>Partners proposed districts the research team would not have reached.</p>
        <h3>3. A method others reuse</h3>
        <p>Two organisations adopted the criteria for their own reporting.</p>
        <h2>What comes next</h2>
        <p>Consultation closes at the end of the quarter and fieldwork begins on the fixed scope. Success is partners using the published method for their own national reports.</p>
