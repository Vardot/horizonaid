  field_content:
    -
      value: "<p>The 2026 index reviews legal aid access, detention practice and freedom of movement in every country where our legal teams operate.</p><h3>Method</h3><p>Findings combine case files from our own legal aid clinics with public court records and interviews conducted by local partner organisations.</p><h3>Using the index</h3><p>Partners use the country scores to prioritise where to place legal aid hours in the coming year, and to brief donors on where protection needs are rising.</p>"
