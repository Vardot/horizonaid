  field_content:
    -
      value: "<p>Mobile health units now cover three border corridors, bringing paediatric care, vaccination and maternal health screening to families who live days away from the nearest clinic.</p><h3>What the teams carry</h3><p>Each unit travels with a nurse, a community health worker and a translator, and reports back to the nearest referral hospital the same day. Cases that need surgery are transported under an agreement with two regional hospitals.</p><h3>What comes next</h3><p>Local health authorities are training a second cohort of community health workers so each corridor keeps a permanent team after the emergency phase ends.</p>"
      format: content_format
