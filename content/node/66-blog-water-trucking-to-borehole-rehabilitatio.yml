        <h2>Introduction</h2>
        <p><strong>MAI AINI</strong> — Moving from emergency water delivery to permanent infrastructure in drought-affected districts. In two districts the boreholes are now running and the trucks have stopped. This report compares the cost of each litre before and after.</p>
        <h2>The problem, before the work started</h2>
        <p>Trucking water is fast, expensive and endless; a rehabilitated borehole is slow, cheap and permanent. Trucking consumed most of the water budget and still left villages dry whenever roads flooded. Women spent hours each day queuing at the tanker.</p>
        <blockquote><p>Trucking buys time. If you are not spending that time drilling, you are just buying it again next month.</p><p><strong>Rahel Tesfay</strong>, water engineer</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Every trucked litre is treated as a countdown to the borehole that replaces it. Trucking continues only until the borehole at that site is pumping, then the budget moves to the next site on the list.</p>
        <ul><li>Trucking contracted month to month, never annually, so it can end quickly</li><li>Boreholes surveyed while trucking runs, not after it stops</li><li>Pumps specified for parts available in the nearest market town</li><li>A water committee trained and paid before the handover, not after</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="c749d4bc-2a5e-47e1-a3ed-ce85781612b9" data-align="center" alt="Water trucking to borehole rehabilitation"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Water reached every site on the list, and the switch from trucks to boreholes produced three further results.</p>
        <h3>1. Cost that falls to nothing</h3>
        <p>A rehabilitated borehole costs a fraction of a year of trucking, and the saving compounds every month it runs.</p>
        <h3>2. Water that survives access loss</h3>
        <p>When a road closed for six weeks, the settlements on boreholes were unaffected.</p>
        <h3>3. Committees with a real budget</h3>
        <p>Tariffs set by the committee cover parts and a caretaker, which is what keeps the pump turning.</p>
        <h2>What comes next</h2>
        <p>The next stage retires trucking at four more sites and moves the saved budget into spare-part stockpiles. Each borehole is meant to run on its committee's budget, without a call to us when a pump fails.</p>
