  field_our_role:
    -
      value: '<p>Conflict and flooding in Myanmar have displaced communities repeatedly, and formal humanitarian access is limited. We work through community organisations to keep children learning through displacement and to deliver emergency relief where larger agencies cannot operate. Our role is funding, supplies and technical support rather than visibility, because local partners carry the risk and the relationships. Temporary learning spaces are set up within weeks of a displacement, so children lose months of school rather than years.</p>'
