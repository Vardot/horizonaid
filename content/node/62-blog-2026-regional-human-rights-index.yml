      value: |-
        <h2>Introduction</h2>
        <p><strong>REGIONAL</strong> — Field data auditing educational safety, funding transparency and legislative progress across the countries we work in. This year's edition covers every district where we run programmes. It sets out what the data shows, where the gaps are widest, and which reforms it supports.</p>
        <h2>The problem, before the work started</h2>
        <p>Rights reporting arrives late, in aggregate, and too general to act on. Local groups could see violations around them but had nothing comparable to cite. Ministries answered with national averages that hid the worst districts.</p>
        <blockquote><p>An index nobody can check is an opinion. We publish the method so the number can be argued with.</p><p><strong>Dr Leila Mansour</strong>, research lead</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>The index is built from verified case data, published by district and repeated annually. Each figure traces to a verified case, so a ministry that disputes it has to dispute the record, not the method.</p>
        <ul><li>Cases verified against at least two independent sources</li><li>Published by district so local actors can use it</li><li>Methodology published in full alongside the figures</li><li>The same method repeated each year for comparability</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="e1408d47-fc69-4b5e-a7bb-38ea345953f5" data-align="center" alt="2026 regional human rights index"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>The index was built to inform donors. Its larger effect has been on the groups that use it locally.</p>
        <h3>1. Local advocacy</h3>
        <p>District figures gave community organisations something specific to raise.</p>
        <h3>2. Comparable years</h3>
        <p>An unchanged method made the second edition genuinely informative.</p>
        <h3>3. Contested and improved</h3>
        <p>Two disputed districts were re-verified and corrected in the published errata.</p>
        <h2>What comes next</h2>
        <p>The next edition adds detention data and opens the case-verification protocol to partner review. The index matters if district officials start quoting it in their own reports.</p>
