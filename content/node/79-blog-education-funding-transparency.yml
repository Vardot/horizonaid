        <h3>Introduction</h3>
        <p><strong>NAIROBI</strong> — Where education money actually lands, traced from donor to classroom. What began as a local difficulty is now a structural one, and it shapes daily life for every household here. This brief sets out the evidence, the cost of inaction, and what should follow.</p>
        <h3>The problem, before the work started</h3>
        <p>Money reaches education budgets and then becomes difficult to follow. Households absorbed the difference themselves — in time, in money, and in risks they would not otherwise take. Those costs rarely appear in a budget line, but they decide whether a family recovers or slips further.</p>
        <blockquote><p>You cannot argue about a shortfall until everyone can see the same number.</p><p><strong>Grace Wanjiru</strong>, policy analyst</p></blockquote>
        <h3>How the work was delivered</h3>
        <p>Published, itemised spending makes the gap between allocation and delivery visible. The approach was chosen because it survives the conditions here: staff turnover, seasonal access, and a population that may move at short notice.</p>
        <ul><li>Every disbursement published within the quarter it is made</li><li>School-level figures, not district aggregates</li><li>Categories agreed with the ministry so the data can be compared</li><li>An open format any organisation can reuse</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="9a36d753-9d1e-4913-9c33-14dec94831a5" data-align="center" alt="Education funding transparency"></drupal-media>
        <h3>What changed beyond the immediate goal</h3>
        <p>The direct objective was met, but the effects that matter most were the ones we did not set out to produce.</p>
        <h4>1. Faster correction</h4>
        <p>Schools missing a disbursement were identified in weeks rather than at the annual audit.</p>
        <h4>2. Better questions</h4>
        <p>Local committees arrived at meetings with the figures already read.</p>
        <h4>3. Comparable years</h4>
        <p>A stable format made the second year's data worth something, which the first year's alone was not.</p>
        <h3>What comes next</h3>
        <p>The next release adds teacher deployment alongside spending, so both can be read together. The measure of success is not how long we stay, but whether the work continues once we have gone.</p>
