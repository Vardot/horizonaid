      value: |-
        <h2>Introduction</h2>
        <p><strong>BEIRUT</strong> — Without papers a family cannot enrol a child, access a clinic or report abuse. What our legal desks do about it. Our legal desks registered births, renewed residency papers and replaced lost IDs. This brief sets out the caseload and what changes in a family's life once the papers exist.</p>
        <h2>The problem, before the work started</h2>
        <p>Without papers, a person cannot be treated, enrolled, employed or protected. Children went unregistered and could not sit exams. Adults stopped travelling to work for fear of being stopped at a checkpoint.</p>
        <blockquote><p>A birth certificate is not paperwork. It is the difference between a child existing and not existing.</p><p><strong>Karim Haddad</strong>, protection lawyer</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Documentation is treated as protection work, not administration. Each desk sits inside a community centre, so a family can bring a document problem to the place where they already go for other help.</p>
        <ul><li>Mobile registration desks placed where people already gather</li><li>Legal aid attached to the desk, not referred onward</li><li>Records duplicated and held securely against loss</li><li>Ministry liaison staffed so cases do not stall</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="c749d4bc-2a5e-47e1-a3ed-ce85781612b9" data-align="center" alt="Documentation as protection"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Thousands of documents were issued, and the effects reached well past the paperwork.</p>
        <h3>1. Access to school</h3>
        <p>Enrolment refusals fell sharply once families arrived with documents in hand.</p>
        <h3>2. Safer movement</h3>
        <p>Documented travellers were far less likely to be detained at checkpoints.</p>
        <h3>3. Claims that survive</h3>
        <p>Property and inheritance claims filed with correct papers are still standing years later.</p>
        <h2>What comes next</h2>
        <p>The next phase trains ministry staff to run the desks and reduces our role to legal support. We will know this has worked when ministry staff run the desks and families still come.</p>
