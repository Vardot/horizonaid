      value: |-
        <h2>Introduction</h2>
        <p><strong>ZAATARI</strong> — Temporary classrooms kept nine thousand children in lessons through a year of repeated displacement. Some children moved site three times during the year and still finished it. This update covers attendance, exam results and what each classroom cost to run.</p>
        <h2>The problem, before the work started</h2>
        <p>A displaced child loses a year of school for every year the site lacks a classroom. Children who miss a year rarely return to the grade they left. Older girls in particular dropped out and did not come back.</p>
        <blockquote><p>If the year does not count, the building is just shelter with desks in it.</p><p><strong>Mahmoud Sror</strong>, education adviser</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Temporary learning spaces go up in weeks and are recognised by the education ministry. Ministry recognition means a child's year counts wherever the family moves next.</p>
        <ul><li>Structures designed to be assembled by the community that will use them</li><li>Curriculum aligned so the year counts towards certification</li><li>Teachers drawn from the displaced population and trained on site</li><li>Ministry recognition negotiated before the first class</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="e590a1b0-41c2-42ad-8659-c9f38b586c88" data-align="center" alt="Safe learning spaces after displacement"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Attendance held through every move, and the classrooms became useful in ways the plan did not cover.</p>
        <h3>1. Certification that transfers</h3>
        <p>Pupils moving on carried recognised credit rather than starting again.</p>
        <h3>2. Employment for teachers</h3>
        <p>Displaced teachers returned to their profession instead of leaving it.</p>
        <h3>3. A centre for everything else</h3>
        <p>The space doubled as the site for vaccination days and community meetings.</p>
        <h2>What comes next</h2>
        <p>The next stage converts three temporary spaces into permanent schools under ministry management. Success is the ministry staffing and funding these classrooms after the handover.</p>
