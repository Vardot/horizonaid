  field_our_role:
    -
      value: '<p>In parts of South Sudan flooding now displaces more people than conflict, and it returns every year. We support farming and fishing livelihoods, run nutrition programmes for children under five, and provide protection services in displacement sites. Seed and fishing gear are distributed to match the flood calendar rather than the funding calendar. Nutrition screening runs through the same community workers year round, so cases are caught before they become emergencies.</p>'
