      value: |-
        <h2>Introduction</h2>
        <p><strong>AMMAN</strong> — Mobile health units delivered emergency paediatric care and preventative supplies to more than forty remote settlements this quarter. Most of those settlements had not seen a doctor since the nearest crossing point closed. Below are the cases the teams treated, the cost per visit, and what the two ministries agreed as a result.</p>
        <h2>The problem, before the work started</h2>
        <p>Border corridors sit between health systems, and neither treats them as its responsibility. Families crossed checkpoints to reach a clinic, or waited until a fever became an emergency. A child with pneumonia was often three days from treatment by the time anyone saw them.</p>
        <blockquote><p>You cannot talk about nutrition or education when the nearest doctor is on the other side of a line on a map.</p><p><strong>Dr Amina Al-Sayed</strong>, paediatrician</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Mobile units cover the gap while the two ministries agree who owns it. Units carry their own power and cold chain, so a closed road delays a visit by a day rather than cancelling it.</p>
        <ul><li>Units staffed to treat, not only to screen</li><li>Medicines matched to what the corridor's clinics actually see</li><li>Case notes shared with both ministries in a format each accepts</li><li>Referral routes tested before a patient needs them</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="56fb9041-52f0-423e-a332-4a1e708df5df" data-align="center" alt="Bridging medical gaps in border corridors"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>The paediatric caseload was cleared, and three gains followed that the quarter's plan never listed.</p>
        <h3>1. Chronic care that continues</h3>
        <p>Patients on long-term medication kept their supply instead of restarting treatment each time they moved.</p>
        <h3>2. Outbreaks caught early</h3>
        <p>Shared case notes let both ministries see the same curve at the same time.</p>
        <h3>3. A record that stands up</h3>
        <p>The corridor now appears in both countries' health data, which is the first step to it being funded.</p>
        <h2>What comes next</h2>
        <p>The coming year converts two mobile routes into fixed clinics under a memorandum both ministries have signed. Success here means both ministries budgeting for the corridor in their own plans.</p>
