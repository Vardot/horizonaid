      value: |-
        <h2>Introduction</h2>
        <p><strong>METEMA</strong> — Screening results from four crossings over twelve months. Over twelve months, every positive screen at the four crossings was followed up. This report covers results, referrals and how many patients started treatment.</p>
        <h2>The problem, before the work started</h2>
        <p>Screening at a border is only useful if what it finds leads somewhere. Travellers were tested at the crossing and moved on before anyone could act on the result.</p>
        <blockquote><p>A screening programme that only counts people is surveillance. Attach a clinic and it becomes health care.</p><p><strong>Dr Solomon Bekele</strong>, district health officer</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Every positive screen is attached to a named clinic before the traveller moves on. Each traveller leaves the crossing with a named clinic, an appointment and a phone number to call.</p>
        <ul><li>Screening points staffed by health workers, not administrators</li><li>Treatment started at the point of screening where possible</li><li>Onward referral written down and given to the patient</li><li>Results shared with the district health office weekly</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="63c0f85c-2459-4aa2-af2c-4b012f5857c6" data-align="center" alt="Border health screening outcomes"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Referral rates rose at every crossing, and the system produced three further results.</p>
        <h3>1. Treatment actually started</h3>
        <p>The proportion of positive screens reaching treatment rose once referral was written, not spoken.</p>
        <h3>2. Earlier district response</h3>
        <p>Weekly reporting let the district see a rise while it was still small.</p>
        <h3>3. Less duplication</h3>
        <p>Travellers screened once and documented were not screened repeatedly down the corridor.</p>
        <h2>What comes next</h2>
        <p>The next phase links the screening record to the district system so referral can be confirmed. Success is the district system tracking every referral without our staff at the crossings.</p>
