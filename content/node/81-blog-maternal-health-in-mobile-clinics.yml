      value: |-
        <h2>Introduction</h2>
        <p><strong>BENTIU</strong> — Antenatal care delivered by units that follow the routes families actually travel. Most women along these routes had never had an antenatal check. This report covers visits, referrals and births attended across the year.</p>
        <h2>The problem, before the work started</h2>
        <p>The distance to a delivery room decides whether a complication is survivable. The nearest delivery room was a day's walk away, and complications were found only once labour had started.</p>
        <blockquote><p>A mother will walk two hours for a clinic she knows will be there. She will not walk two hours to find out.</p><p><strong>Dr Amal Deng</strong>, obstetrician</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Clinics travel to a fixed weekly schedule so mothers can plan a visit rather than gamble on one. A fixed weekly stop means a woman can plan her visits around the season and her other work.</p>
        <ul><li>Routes fixed and published, so the visit is predictable</li><li>Midwives recruited locally and paid through the health ministry</li><li>Referral transport arranged before it is needed</li><li>Records held by the mother, so care continues if the clinic moves</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="67a76fae-bc22-4aa1-a144-4f39e44428ce" data-align="center" alt="Maternal health in mobile clinics"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Antenatal visits rose along every route, and regular contact changed outcomes beyond the checks.</p>
        <h3>1. Earlier detection</h3>
        <p>Complications found at a routine visit rather than in an emergency at night, which changes the outcome entirely.</p>
        <h3>2. Vaccination alongside</h3>
        <p>Infants reached on the same visit, because the queue is already there.</p>
        <h3>3. Fewer unattended births</h3>
        <p>Attendance rose steadily once the schedule had held for three consecutive months.</p>
        <h2>What comes next</h2>
        <p>The next phase adds two routes and puts an ultrasound on the vehicle that covers the longest circuit. Success is the county health department funding the routes once the pilot ends.</p>
