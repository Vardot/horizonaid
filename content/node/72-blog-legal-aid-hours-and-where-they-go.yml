      value: |-
        <h2>Introduction</h2>
        <p><strong>AMMAN</strong> — How we decide which corridor or district receives the next tranche of legal aid capacity. Demand for legal aid exceeds our capacity in every district we serve. This brief sets out how the hours were allocated last year and what that allocation decided.</p>
        <h2>The problem, before the work started</h2>
        <p>Legal aid is scarce, so where the hours go decides who gets protection. Requests were handled in the order they arrived, so urgent detention cases queued behind routine paperwork.</p>
        <blockquote><p>We could not defend how we spent the hours until we could see how we spent the hours.</p><p><strong>Nour Khalil</strong>, legal aid coordinator</p></blockquote>
        <h2>How the work was delivered</h2>
        <p>Hours are logged by case type, and the allocation is published. Publishing the allocation lets partners and communities see the trade-offs and challenge them.</p>
        <ul><li>Every hour logged against a case category</li><li>Allocation reviewed quarterly against demand</li><li>Waiting times published alongside the split</li><li>Cases that time out counted and reported</li></ul>
        <drupal-media data-entity-type="media" data-entity-uuid="fbca9adb-bf14-44fb-a1a3-c6f02b725a23" data-align="center" alt="Legal aid hours and where they go"></drupal-media>
        <h2>What changed beyond the immediate goal</h2>
        <p>Urgent cases now reach a lawyer faster, and publishing the numbers had effects of its own.</p>
        <h3>1. Shorter waits for urgent cases</h3>
        <p>Reallocation cut the wait for detention cases substantially.</p>
        <h3>2. Honest capacity limits</h3>
        <p>Published timing out made the shortfall arguable with funders.</p>
        <h3>3. Referrals that fit</h3>
        <p>Partners could see which categories had capacity before referring.</p>
        <h2>What comes next</h2>
        <p>The next report adds outcome by category, so hours can be weighed against what they achieve. This works if partners start allocating their own legal aid hours the same way.</p>
