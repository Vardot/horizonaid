      component_id: sdc.vartheme_bs5_horizonaid.text
      inputs:
        text:
          value: '<ul><li data-list-item-id="e8a19c7a14d347daae07cfd84969038e2">How to assess your organisation''s current digital vulnerability</li><li data-list-item-id="ee834114c579cbc192073430ebc2be9b3">Best practices for encrypted field communications</li><li data-list-item-id="e44d52fe37ad8f03770fbde8e1a49e1c0">Protecting donor and beneficiary data under GDPR and international standards</li><li data-list-item-id="efb6be4680cd212bdd74974b3591737d5">Responding to a security breach — a step-by-step guide</li></ul>'
