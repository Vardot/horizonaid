      uuid: ca08be1c-8569-4dc1-a675-56704b319e6a
      component_id: sdc.vartheme_bs5_horizonaid.text
      inputs:
        text:
          value: '<p>As humanitarian organisations increasingly rely on digital tools to coordinate field operations and manage donor relationships, the risk of cyber threats has grown significantly. This webinar brings together digital security experts and frontline practitioners to share practical strategies for protecting sensitive information in high-risk environments.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: d2d30e72-099c-4806-befe-358a3c224dd4
      slot: col_1
      uuid: 0a416621-98a3-4fc6-ac71-6642354a34f4
      component_id: sdc.vartheme_bs5_horizonaid.text
      inputs:
        text:
          value: "<p>Whether you're a field coordinator managing encrypted communications or an advocacy lead handling confidential supporter data, this session will equip you with the frameworks and tools needed to operate securely.</p>"
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
