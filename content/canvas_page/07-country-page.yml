      slot: col_1
      uuid: cf2f11e0-cd7b-4539-937b-c20d3aaf1a88
      component_id: sdc.vartheme_bs5_horizonaid.text
      inputs:
        text:
          value: "<p>Afghanistan faces intersecting crises — decades of conflict, severe drought, economic collapse, and one of the world's largest displacement crises. Horizon Aid works in partnership with local organisations across Kabul, Kandahar, and the northeastern provinces, delivering emergency shelter, clean water, education support, and legal protection to families who have been displaced multiple times. Our approach is entirely community-led — we follow the priorities of the people we serve, not the agendas of external donors.</p>"
          format: canvas_html_block
        text_size: none
        text_color: text-body
