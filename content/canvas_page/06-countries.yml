    component_id: sdc.vartheme_bs5_horizonaid.text
    inputs:
      text:
        value: <p>Horizon Aid operates across more than 16 countries, working alongside
          communities facing the most acute humanitarian crises of our time — conflict,
          displacement, food insecurity, and climate-driven hardship. Our work is
          rooted in the regions where the need is greatest and the presence of international
          support is often weakest. Every country we work in is guided by local leadership,
          community trust, and a long-term commitment to dignity and self-determination.</p>
        format: canvas_html_block
      text_size: none
      text_color: text-body
