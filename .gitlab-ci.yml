################################################################################
# GitLab CI for the Horizon Aid site template recipe.
#
# build    - validate the recipe's composer.json.
# validate - lint YAML, spell-check + ESLint the suite, and a Cucumber dry-run
#            that proves every step phrasing in the Varbase functional testing
#            suite resolves (all reproducible offline in gitlab-ci-local).
# pre-test - 📦 (Varbase) Install Horizon Aid site template: build a Varbase 11 host project, require the
#            checked-out Horizon Aid recipe, install it with
#            `drush site:install recipes/horizonaid`, prepare it for deterministic
#            testing, then DUMP the DB (gzip). The built site (testsite/), the
#            varbase-e2e node_modules and the Playwright browser are cached so
#            the test jobs reuse them instead of rebuilding per job.
# test     - one parallel varbase-e2e job per feature bucket: pull the build
#            cache, restore the DB dump (seconds), serve the site and drive it
#            through the browser. No composer create-project / require /
#            site:install / npm install per job.
# report   - merge every bucket's cucumber JSON into one HTML + PDF report.
#
# = Automated Functional Acceptance Testing (varbase-e2e) =
################################################################################

stages:
  - build
  - validate
  - pre-test
  - test
  - report

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_NO_INTERACTION: "1"
  VARBASE_PROJECT: "drupal/varbase_project:11.0.x-dev"
  DRUPAL_ADMIN_USERNAME: "webmaster"
  DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
  # Host site is built under testsite/ (this repo is a recipe, not a docroot).
  SITE_DIR: "$CI_PROJECT_DIR/testsite"
  WEB_ROOT: "$CI_PROJECT_DIR/testsite/web"
  DB_URL: "mysql://drupal:drupal@database/drupal"
  LAUNCH_URL: "http://127.0.0.1:8888"
  FORCE_COLOR: "1"
  VARBASE_E2E_REPORT_DISABLE: "1"
  # Cache locations: composer downloads + the Playwright browser go inside the
  # project dir so the Install job can cache them for the pull-only test jobs.
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/composer"
  PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/.cache/ms-playwright"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# = Path-based job gating (Reduce CI usage) ===================================
# Skip a job when the files it cares about did not change, but ALWAYS run the
# full pipeline on the default branch, release branches and tags. A job whose
# files did not change stays LISTED as a non-optional manual (allow_failure:
# false), never dropped.
.run_on_release_refs: &run_on_release_refs
  if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: on_success

# What a recipe developer edits: the recipe itself (recipe.yml / recommended.yml
# / config / content / scripts) and the functional testing suite + its config.
.recipe_app_changes: &recipe_app_changes
  - "composer.json"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/**/*"
  - "recipe.yml"
  - "recommended.yml"
  - "config/**/*"
  - "content/**/*"
  - "scripts/**/*"
  - "tests/**/*"
  - "package.json"
  - "package-lock.json"
  - "cucumber.js"
  - "eslint.config.js"
  - "playwright.config.ts"

# Build cache populated by 📦 (Varbase) Install Horizon Aid site template: the built host site (testsite/),
# the varbase-e2e node_modules and the composer + Playwright download caches.
# The test jobs pull this (see .test_cache) so they skip the whole host build
# and only restore the DB dump.
.varbase_cache: &varbase_cache
  key: "horizonaid-build-v2-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/composer
    - .cache/ms-playwright
    - testsite
    - node_modules

.test_cache: &test_cache
  key: "horizonaid-build-v2-$CI_COMMIT_REF_SLUG"
  policy: pull
  paths:
    - .cache/composer
    - .cache/ms-playwright
    - testsite
    - node_modules

# = Reusable before_script fragments =
.fragments:
  # The Playwright image is Ubuntu noble (PHP 8.3 default); add ondrej/php for
  # PHP 8.4, then PHP + Composer + ImageMagick/WebP + a MySQL client. Needed by
  # the Install job (build + drush) and by every test job (drush restore/serve).
  host_php_setup:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -y
    - apt-get install -y --no-install-recommends software-properties-common ca-certificates curl gnupg lsb-release
    - add-apt-repository -y ppa:ondrej/php
    - apt-get update -y
    - apt-get install -y --no-install-recommends php8.4-cli php8.4-mysql php8.4-gd php8.4-curl php8.4-xml php8.4-mbstring php8.4-zip php8.4-intl unzip git default-mysql-client webp imagemagick libmagickcore-6.q16-6-extra
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - corepack enable || true
    - composer --version && php --version
    - sed -i 's/rights="none"\s*pattern="WEBP"/rights="read|write" pattern="WEBP"/I' /etc/ImageMagick-*/policy.xml 2>/dev/null || true

# = build = validate the recipe's composer.json (schema + metadata, offline).
"📦 Composer validate":
  stage: build
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "composer.json"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible. allow_failure
    # stays false so that when it IS run it must pass.
    - when: manual
      allow_failure: false
  image: composer:2
  script:
    - composer --version
    - composer validate --no-check-all --no-check-publish

# = validate = lint every YAML file (recipe.yml + config/*) for syntax errors.
"📐 YAML lint":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.yml"
        - "**/*.yaml"
      when: on_success
    - when: manual
      allow_failure: false
  image: python:3.12-slim
  needs: []
  before_script:
    - pip install --no-cache-dir pyyaml
  script:
    - |
      python - <<'PY'
      import sys, yaml
      from pathlib import Path
      class Loader(yaml.SafeLoader):
          pass
      Loader.add_multi_constructor('', lambda loader, suffix, node: None)
      SKIP = ('node_modules/', '.cache/', 'tests/reports/', 'testsite/')
      errors = count = 0
      for path in sorted(Path('.').rglob('*.y*ml')):
          rel = str(path)
          if any(s in rel for s in SKIP):
              continue
          count += 1
          try:
              with open(path) as fh:
                  list(yaml.load_all(fh, Loader=Loader))
          except yaml.YAMLError as e:
              errors += 1
              print(f"INVALID: {rel}\n  {e}")
      print(f"Checked {count} YAML files, {errors} invalid.")
      sys.exit(1 if errors else 0)
      PY
  allow_failure: false

"🔤 Cspell":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "tests/**/*.feature"
        - "tests/README.md"
        - "cucumber.js"
        - "eslint.config.js"
        - ".cspell.json"
      when: on_success
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - npm install -g cspell
  script:
    - cspell "tests/**/*.feature" "tests/README.md" "cucumber.js" "eslint.config.js" --no-progress
  allow_failure: false

"🟨 ESLint":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.js"
        - "eslint.config.js"
        - "package.json"
      when: on_success
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - npm install --no-audit --no-fund
  script:
    - node --version
    - ./node_modules/.bin/eslint .

# = Cucumber dry-run = every step phrasing resolves, no browser, no site.
"🧩 Cucumber dry-run":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "tests/**/*"
        - "cucumber.js"
        - "package.json"
      when: on_success
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - npm install --no-audit --no-fund
  script:
    - VARBASE_E2E_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --dry-run

# = pre-test = build the host Varbase site, apply the Horizon Aid recipe, seed the
# site, dump the DB, and cache the built site + node_modules + browser.
"📦 (Varbase) Install Horizon Aid site template":
  stage: pre-test
  rules:
    - <<: *run_on_release_refs
    - changes: *recipe_app_changes
      when: on_success
    - when: manual
      allow_failure: false
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  needs: []
  timeout: 2h
  # composer pulls dists from github.com unauthenticated; a rate limit there is
  # transient, so let the runner re-attempt before the pipeline goes red.
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  cache: *varbase_cache
  services:
    - name: mariadb:10.11
      alias: database
      variables:
        MARIADB_DATABASE: drupal
        MARIADB_USER: drupal
        MARIADB_PASSWORD: drupal
        MARIADB_ROOT_PASSWORD: root
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - horizonaid-db.sql.gz
  before_script:
    - !reference [.fragments, host_php_setup]
  script:
    # = Build a Varbase 11 project, then require the checked-out recipe =
    # The build cache may restore a stale testsite/; composer create-project
    # refuses a non-empty target, so start from a clean dir on every run.
    - rm -rf "$SITE_DIR"
    - composer create-project $VARBASE_PROJECT "$SITE_DIR" --no-interaction --no-install --no-scripts
    - cd "$SITE_DIR"
    - composer config minimum-stability dev
    - composer config repositories.horizonaid path "$CI_PROJECT_DIR"
    - composer require drupal/horizonaid:@dev --no-interaction --no-progress --prefer-dist --with-all-dependencies
    # = Sync the front-end libraries the recipe components expect =
    # create-project ran with --no-scripts, because the varbase_starter recipe that
    # owns the sync script is not on disk until the require above, and `composer
    # require` does not re-fire post-create-project-cmd. Without this web/libraries
    # stays empty: CKEditor 5 then boots without its plugin libraries, throws
    # plugincollection-plugin-not-found, and no rich text field ever mounts, so
    # every editorial scenario that types into one fails while the site otherwise
    # looks healthy. The host's package.json runs the sync from its postinstall
    # hook, so a plain install is enough. --no-immutable because Yarn 4 turns
    # --immutable on whenever CI is set and this throwaway lock is not kept.
    - corepack enable && corepack yarn install --no-immutable
    - ls web/libraries
    # = Install the site from the Horizon Aid recipe =
    - ./bin/drush site:install recipes/horizonaid --db-url=$DB_URL
        --account-name=$DRUPAL_ADMIN_USERNAME --account-pass=$DRUPAL_ADMIN_PASSWORD
        --account-mail=webmaster@vardot.com --site-name="Horizon Aid" --locale=en -y
    # = Prepare for deterministic testing =
    # Antibot blocks the login form for an automated browser. Autosave Form saves
    # an open form every 60 seconds, and the next visit to that form then opens
    # with a "resume editing or discard" dialog whose overlay swallows every
    # click, so one slow editorial scenario silently breaks the next one.
    - ./bin/drush pm:uninstall antibot autosave_form -y || true
    - ./bin/drush config:set user.flood ip_limit 1000000 -y
    - ./bin/drush config:set user.flood user_limit 1000000 -y
    - ./bin/drush config:set system.logging error_level all -y
    - ./bin/drush cache:rebuild
    # Seed the per-role testing users the permission and editorial features log
    # in as. varbase-e2e's "I am a logged in user with the ... user" step only
    # submits the login form - it does not create the account - so without these
    # every role-scoped scenario lands anonymous and fails on "Log out".
    # scripts/add-testing-users.sh assumes a docroot/ layout, so seed inline
    # against this host's web/ root. Roles come from varbase_users_base.
    - |
      seed_user () {
        ./bin/drush user:create "$1" --mail="$2" --password="dD.123123ddd" || \
          ./bin/drush user:password "$1" "dD.123123ddd" || true
        if [ "$3" != "_none_" ]; then ./bin/drush user:role:add "$3" "$1" || true; fi
      }
      seed_user "Normal user"    "test.authenticated@vardot.com"  "_none_"
      seed_user "Content editor" "test.content_editor@vardot.com" "content_editor"
      seed_user "Content admin"  "test.content_admin@vardot.com"  "content_admin"
      seed_user "SEO admin"      "test.seo_admin@vardot.com"      "seo_admin"
      seed_user "Site admin"     "test.site_admin@vardot.com"     "site_admin"
      seed_user "Super admin"    "test.super_admin@vardot.com"    "administrator"
    - ./bin/drush cache:rebuild
    # = Install the varbase-e2e suite + the matching Chromium (cached) =
    - cd "$CI_PROJECT_DIR"
    - npm install --no-audit --no-fund
    - ./node_modules/.bin/playwright install chromium
    # = Dump the prepared DB for the parallel test jobs =
    - $SITE_DIR/bin/drush --root=$WEB_ROOT sql:dump --gzip --result-file=$CI_PROJECT_DIR/horizonaid-db.sql
  allow_failure: false


# = pre-test = prove the Drupal CMS wiring: build a plain drupal/cms codebase,
# run scripts/drupal-cms-wiring.php on it, require this recipe and install the
# site template through the Drupal CMS installer. This is the only job that
# exercises Horizon Aid off a Varbase base, so it guards the wiring script and the
# vardot/varbase-patches requirement against drifting out of use.
"🧩 (Drupal CMS) Install Horizon Aid site template":
  stage: pre-test
  rules:
    - <<: *run_on_release_refs
    - changes: *recipe_app_changes
      when: on_success
    - when: manual
      allow_failure: false
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  needs: []
  timeout: 2h
  # composer pulls dists from github.com unauthenticated; a rate limit there is
  # transient, so let the runner re-attempt before the pipeline goes red.
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  cache: *varbase_cache
  services:
    - name: mariadb:10.11
      alias: database
      variables:
        MARIADB_DATABASE: drupal
        MARIADB_USER: drupal
        MARIADB_PASSWORD: drupal
        MARIADB_ROOT_PASSWORD: root
  variables:
    # A separate root from the Varbase job's testsite/, so both can run in one
    # pipeline without sharing a codebase.
    CMS_SITE_DIR: "$CI_PROJECT_DIR/cmssite"
  before_script:
    - !reference [.fragments, host_php_setup]
  script:
    # = Build a plain Drupal CMS project — no Varbase wiring of any kind =
    - composer create-project drupal/cms "$CMS_SITE_DIR" --no-interaction --no-install --no-scripts
    - cd "$CMS_SITE_DIR"
    # = Wire it for a Site recipe: dev stability, allow-plugins, the patches
    #   allowlist, the drupal-libraries block and Yarn's node-modules linker.
    #   Run from the project root; the script resolves the root from getcwd().
    - php "$CI_PROJECT_DIR/scripts/drupal-cms-wiring.php"
    # = Point at the checked-out recipe and require it. --with-all-dependencies is
    #   required: a partial update keeps the locked symfony/css-selector, which
    #   drupal/storybook (via varbase_dev_base) conflicts with.
    # symlink:false — the recipe must be COPIED in. A path-repo symlink would
    # point recipes/horizonaid back at $CI_PROJECT_DIR, which contains this build,
    # and any recursive scan then loops until "Too many levels of symbolic links".
    - composer config repositories.horizonaid '{"type":"path","url":"'"$CI_PROJECT_DIR"'","options":{"symlink":false}}' --json
    # The curated Drupal core patches this template relies on. Without them core
    # lacks the fix for issue #2741429 and the install dies in
    # drupal_cms_search's display cloning with "getConfigDependencyName() on
    # null". The allow-list the wiring script writes only permits these patches,
    # it does not pull them in, and neither the recipe nor drupal/cms requires it.
    - composer require vardot/varbase-patches --no-interaction --no-progress
    - composer require drupal/horizonaid:@dev --no-interaction --no-progress --prefer-dist --with-all-dependencies
    # = Assert the wiring took effect, so a silent no-op cannot pass =
    - test -d recipes/horizonaid || (echo "❌ recipes/horizonaid missing" && exit 1)
    - test -d web/modules/contrib/canvas || (echo "❌ drupal/canvas missing" && exit 1)
    - composer show vardot/varbase-patches
    - |
      php -r '
        $c = json_decode(file_get_contents("composer.json"), TRUE);
        $p = $c["config"]["allow-plugins"] ?? [];
        $need = ["cweagans/composer-patches", "vardot/varbase-patches", "oomphinc/composer-installers-extender"];
        foreach ($need as $k) {
          if (($p[$k] ?? FALSE) !== TRUE) {
            fwrite(STDERR, "❌ allow-plugins missing: $k\n");
            exit(1);
          }
        }
        if (($c["minimum-stability"] ?? "") !== "dev") {
          fwrite(STDERR, "❌ minimum-stability is not dev\n");
          exit(1);
        }
        // Dependencies that declare patches with a path relative to the project
        // root cannot resolve here (drupal/ai_context is one), so patch
        // resolution is default-deny and those are ignored outright, exactly as
        // varbase_project does it.
        $cp = $c["extra"]["composer-patches"] ?? [];
        foreach (["vardot/varbase-patches", "vardot/drupal-core-patches"] as $a) {
          if (!in_array($a, $cp["allowed-dependency-patches"] ?? [], TRUE)) {
            fwrite(STDERR, "❌ allowed-dependency-patches missing: $a\n");
            exit(1);
          }
        }
        foreach (["drupal/*", "drupal/ai_context"] as $i) {
          if (!in_array($i, $cp["ignore-dependency-patches"] ?? [], TRUE)) {
            fwrite(STDERR, "❌ ignore-dependency-patches missing: $i\n");
            exit(1);
          }
        }
        print "✅ composer wiring in place\n";
      '
    # = Sync the front-end libraries the recipe components expect =
    - corepack enable && corepack yarn install --no-immutable
    - |
      php -r '
        $libs = json_decode(file_get_contents("package.json"), TRUE)["drupal-libraries"]["libraries"] ?? [];
        if (count($libs) < 6) {
          fwrite(STDERR, "❌ the drupal-libraries block is not wired\n");
          exit(1);
        }
        printf("✅ %d libraries declared\n", count($libs));
      '
    - ls web/libraries
    # = Install the site template through the Drupal CMS installer =
    - ./vendor/bin/drush site:install drupal_cms_installer
      installer_site_template_form.add_ons=horizonaid
      --db-url=$DB_URL
      --account-name=$DRUPAL_ADMIN_USERNAME --account-pass=$DRUPAL_ADMIN_PASSWORD
      --account-mail=webmaster@vardot.com --site-name="Horizon Aid on Drupal CMS" --locale=en -y
    # = Prove the template is applied, not merely that the install exited 0 =
    - ./vendor/bin/drush status --fields=drupal-version,theme,db-status
    - |
      THEME=$(./vendor/bin/drush config:get system.theme default --format=string)
      echo "default theme: $THEME"
      test "$THEME" = "vartheme_bs5_horizonaid" || (echo "❌ vartheme_bs5_horizonaid is not the default theme" && exit 1)
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - cmssite/composer.json
      - cmssite/package.json
  allow_failure: false

# = Automated Functional Acceptance Testing (varbase-e2e) - one parallel job per
# feature bucket. Restores the built site + DB dump from 📦 (Varbase) Install Horizon Aid site template.
"🧪 varbase-e2e":
  stage: test
  rules:
    - <<: *run_on_release_refs
    - changes: *recipe_app_changes
      when: on_success
    - when: manual
      allow_failure: false
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  needs: ["📦 (Varbase) Install Horizon Aid site template"]
  timeout: 2h
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  cache: *test_cache
  parallel:
    matrix:
      - SUITE: "01-website-base-requirements"
        FEATURES_GLOB: "tests/features/01-website-base-requirements/**/*.feature"
      - SUITE: "02-countries"
        FEATURES_GLOB: "tests/features/02-countries/**/*.feature"
      - SUITE: "03-programs"
        FEATURES_GLOB: "tests/features/03-programs/**/*.feature"
      - SUITE: "04-resources"
        FEATURES_GLOB: "tests/features/04-resources/**/*.feature"
      - SUITE: "05-events"
        FEATURES_GLOB: "tests/features/05-events/**/*.feature"
      - SUITE: "06-impact-and-donate"
        FEATURES_GLOB: "tests/features/06-impact-and-donate/**/*.feature"
      - SUITE: "07-quality"
        FEATURES_GLOB: "tests/features/07-quality/**/*.feature"
      - SUITE: "08-seo"
        FEATURES_GLOB: "tests/features/08-seo/**/*.feature"
      # 09-editorial is split: the seven CRUD features together exceed the
      # runner's hard 30-minute job cap ("execution took longer than 30m0s").
      - SUITE: "09-editorial-a"
        FEATURES_GLOB: "tests/features/09-editorial/09-{01,02,03}-*.feature"
      - SUITE: "09-editorial-b"
        FEATURES_GLOB: "tests/features/09-editorial/09-{04,05}-*.feature"
      - SUITE: "09-editorial-c"
        FEATURES_GLOB: "tests/features/09-editorial/09-{06,07}-*.feature"
      - SUITE: "10-01-canvas-pages-listed"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-01-canvas-pages-listed.feature"
      - SUITE: "10-02-canvas-home-about"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-02-canvas-editor-home-about.feature"
      - SUITE: "10-03-canvas-countries-programs"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-03-canvas-editor-countries-programs.feature"
      - SUITE: "10-04-canvas-resources-events"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-04-canvas-editor-resources-events.feature"
      - SUITE: "10-05-canvas-impact-donate"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-05-canvas-editor-impact-donate.feature"
      - SUITE: "11-permissions"
        FEATURES_GLOB: "tests/features/11-permissions/**/*.feature"
  services:
    - name: mariadb:10.11
      alias: database
      variables:
        MARIADB_DATABASE: drupal
        MARIADB_USER: drupal
        MARIADB_PASSWORD: drupal
        MARIADB_ROOT_PASSWORD: root
  variables:
    CUCUMBER_JSON: "cucumber_report--${SUITE}"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 30 days
  before_script:
    # testsite/ + node_modules + the browser arrive from the pull-only cache;
    # only PHP (for drush) is added, then the seeded DB dump is restored.
    - !reference [.fragments, host_php_setup]
    - gunzip -c $CI_PROJECT_DIR/horizonaid-db.sql.gz | $SITE_DIR/bin/drush --root=$WEB_ROOT sql:cli
    - $SITE_DIR/bin/drush --root=$WEB_ROOT cache:rebuild
  script:
    # Serve the restored site (parallel workers for the Canvas editor mounts).
    - PHP_CLI_SERVER_WORKERS=8 $SITE_DIR/bin/drush --root=$WEB_ROOT runserver 127.0.0.1:8888 > $CI_PROJECT_DIR/runserver.log 2>&1 &
    - sleep 8
    - cd "$CI_PROJECT_DIR"
    # One feature bucket per matrix job. cucumber.js reads FEATURES.
    - FEATURES="${FEATURES_GLOB}" VARBASE_E2E_REPORT_DISABLE=1 CUCUMBER_JSON="cucumber_report--${SUITE}" ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  after_script:
    - cd "$CI_PROJECT_DIR"
    - export REPORT="horizonaid--${CI_COMMIT_REF_SLUG:-local}--${SUITE}--automated-functional-testing-report--$(date +%Y-%m-%d)--$(date +%H-%M)"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json "tests/reports/cucumber_report--${SUITE}.json"
        --out  "tests/reports/${REPORT}.html"
        --format all
        --pdf-out "tests/reports/${REPORT}.pdf" || true
  allow_failure: false

# = report = merge every matrix job's cucumber JSON into one combined report.
"📊 Create reports":
  stage: report
  rules:
    # Auto-run whenever the test chain ran (release refs or the app changed),
    # even if a test failed, so the full report is published. DAG-scheduled via
    # needs so it is not held behind an un-played blocking-manual validate job.
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - changes: *recipe_app_changes
      when: always
    - when: never
  image: node:20
  needs: ["🧪 varbase-e2e"]
  dependencies:
    - "🧪 varbase-e2e"
  before_script:
    - apt-get update -y && apt-get install -y jq
    - npm install --no-save --no-audit --no-fund @vardot/varbase-e2e
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    - jq -s 'add' tests/reports/cucumber_report--*.json > tests/reports/cucumber_report.json
    - export REPORT="horizonaid--${CI_COMMIT_REF_SLUG}--automated-functional-testing-report--$(date +%Y-%m-%d)--$(date +%H-%M)"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  "tests/reports/${REPORT}.html"
        --format all
        --pdf-out "tests/reports/${REPORT}.pdf"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
    expire_in: 30 days
  allow_failure: false
