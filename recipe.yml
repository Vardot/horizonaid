name: Horizon Aid
type: Site
description: 'A site template recipe for NGOs, nonprofits and humanitarian/aid organizations, built the Varbase recipe-first way.'
recipes:
  - varbase_users_base
  - drupal_cms_admin_ui
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_forms
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_seo_basic
  - drupal_cms_seo_tools
  - drupal_cms_accessibility_tools
  - drupal_cms_search
  - easy_email_express
  - varbase_admin_base
  - varbase_security_base
  - varbase_media_base
  - varbase_editor_base
  - varbase_content_base
  - varbase_workflow_base
  - varbase_seo_base
  - varbase_webform_base
  - varbase_page_base
  - varbase_blog_base
  - varbase_events_base
  - varbase_performance_base
install:
  - vartheme_bs5_horizonaid
  - better_exposed_filters
config:
  strict: false
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5_horizonaid
    # Override only the Varbase admin/navigation logo + favicon paths with the
    # site template icon; the rest of the varbase_*_base recipe config is kept.
    gin.settings:
      simpleConfigUpdate:
        logo:
          use_default: false
          path: themes/contrib/vartheme_bs5_horizonaid/logo-icon.svg
        favicon:
          use_default: false
          mimetype: image/vnd.microsoft.icon
          path: themes/contrib/vartheme_bs5_horizonaid/favicon.ico
    gin_login.settings:
      simpleConfigUpdate:
        logo:
          use_default: false
          path: themes/contrib/vartheme_bs5_horizonaid/logo.svg
    navigation.settings:
      simpleConfigUpdate:
        logo:
          provider: custom
          path: themes/contrib/vartheme_bs5_horizonaid/logo-icon.svg
          max:
            filesize: 1048576
            height: 40
            width: 40
    package_manager.settings:
      simpleConfigUpdate:
        additional_trusted_composer_plugins:
          - vardot/varbase
          - drupal/horizonaid
          - composer/installers
          - cweagans/composer-patches
          - oomphinc/composer-installers-extender
          - drupal/core-composer-scaffold
          - drupal/core-project-message
          - dealerdirect/phpcodesniffer-composer-installer
          - phpstan/extension-installer
          - php-http/discovery
          - tbachert/spi
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            # @see recommended.yml
            uri: 'https://git.drupalcode.org/api/v4/projects/225987/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 1
          drupalorg_jsonapi: []
          varbase_recipes: []
        default_source: recommended
    ckeditor_media_embed.settings:
      setCKEditorMediaEmbedVersion: true
    canvas.component.block.system_menu_block.social-media-menu:
      enable: []
    canvas.component.block.announce_block:
      disable: []
    canvas.component.block.dashboard_placeholder:
